<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramya's Shopping Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #6A1B9A;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #8E24AA;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .product {
            display: inline-block;
            width: 250px;
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .product img {
            width: 180px;
            height: 180px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #6A1B9A;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4A148C;
        }

        footer {
            margin-top: 30px;
            background-color: #6A1B9A;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ Ramya's Shopping Page</h1>
    <p>Your One-Stop Online Store</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Mobiles</a>
    <a href="#">Laptops</a>
    <a href="#">Fashion</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <h2>Today's Best Deals</h2>

    <div class="product">
        <img src="https://via.placeholder.com/180?text=Smartphone" alt="Phone">
        <h3>Smart Phone</h3>
        <p class="price">₹24,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/180?text=Laptop" alt="Laptop">
        <h3>Gaming Laptop</h3>
        <p class="price">₹69,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/180?text=Headphones" alt="Headphones">
        <h3>Wireless Headphones</h3>
        <p class="price">₹2,999</p>
        <button>Add to Cart</button>
    </div>

</div>

<footer>
    <p>&copy; 2026 Ramya's Shopping Page | All Rights Reserved</p>
</footer>

</body>
</html>
